<script>
/* =========================================================
   NOVA — Bottom Navigation Controller
   ========================================================= */

(() => {
  "use strict";

  function initBottomNavigation() {
    const nav =
      document.querySelector(
        "[data-bottom-nav]"
      );

    if (!nav) {
      return;
    }

    const moreButton =
      nav.querySelector(
        "[data-bottom-nav-more]"
      );

    const menu =
      document.querySelector(
        "[data-bottom-nav-menu]"
      );

    if (!moreButton || !menu) {
      return;
    }

    const closeButtons =
      menu.querySelectorAll(
        "[data-bottom-nav-menu-close]"
      );

    function openMenu() {
      menu.hidden = false;

      requestAnimationFrame(() => {
        menu.classList.add("is-open");
      });

      moreButton.setAttribute(
        "aria-expanded",
        "true"
      );

      document.body.classList.add(
        "nova-bottom-nav-modal-open"
      );
    }

    function closeMenu() {
      menu.classList.remove("is-open");

      moreButton.setAttribute(
        "aria-expanded",
        "false"
      );

      document.body.classList.remove(
        "nova-bottom-nav-modal-open"
      );

      window.setTimeout(() => {
        if (!menu.classList.contains("is-open")) {
          menu.hidden = true;
        }
      }, 180);
    }

    moreButton.addEventListener(
      "click",
      (event) => {
        event.preventDefault();

        if (menu.hidden) {
          openMenu();
        } else {
          closeMenu();
        }
      }
    );

    closeButtons.forEach((button) => {
      button.addEventListener(
        "click",
        closeMenu
      );
    });

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          !menu.hidden
        ) {
          closeMenu();
          moreButton.focus();
        }
      }
    );

    /* Current route */
    const currentPath =
      window.location.pathname
        .split("/")
        .pop();

    nav.querySelectorAll(
      "[data-nav-item]"
    ).forEach((item) => {
      const href =
        item.getAttribute("href");

      if (!href) {
        return;
      }

      const target =
        href.split("/")
          .pop()
          .split("?")[0];

      if (
        target &&
        target === currentPath
      ) {
        item.classList.add(
          "is-active"
        );

        item.setAttribute(
          "aria-current",
          "page"
        );
      }
    });
  }

  function updateUnreadCount(count) {
    const badge =
      document.querySelector(
        "[data-bottom-nav-unread]"
      );

    if (!badge) {
      return;
    }

    const numericCount =
      Number(count);

    if (
      !Number.isFinite(numericCount) ||
      numericCount <= 0
    ) {
      badge.hidden = true;
      badge.textContent = "";
      return;
    }

    badge.hidden = false;

    badge.textContent =
      numericCount > 99
        ? "99+"
        : String(numericCount);
  }

  window.NOVA_BOTTOM_NAV = {
    init: initBottomNavigation,
    updateUnreadCount
  };

  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      initBottomNavigation,
      { once: true }
    );
  } else {
    initBottomNavigation();
  }

})();
</script>
