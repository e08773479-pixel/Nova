<!-- =========================================================
     NOVA — Chat Item Component
     File: components/chat-item.html
     Version: 1.0.0
     Purpose:
     Reusable conversation item for chats list
     No fake/demo data
     ========================================================= -->

<article
  class="nova-chat-item"
  data-chat-item
  data-chat-id=""
  data-chat-type="private"
  data-chat-href="../pages/chat.html"
  tabindex="0"
  role="button"
  aria-label="فتح المحادثة"
>
  <!-- Avatar -->
  <div class="nova-chat-avatar-wrap">
    <div
      class="nova-chat-avatar"
      data-chat-avatar
      aria-hidden="true"
    >
      <span data-chat-avatar-fallback>
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="8"
            r="3.5"
            stroke="currentColor"
            stroke-width="1.7"
          />
          <path
            d="M5.5 19c.7-3.2 3.1-5 6.5-5s5.8 1.8 6.5 5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>
    </div>

    <!-- Online state -->
    <span
      class="nova-chat-online-dot"
      data-chat-online
      hidden
      aria-label="متصل الآن"
    ></span>
  </div>

  <!-- Main content -->
  <div class="nova-chat-content">

    <!-- Top row -->
    <div class="nova-chat-top">

      <div class="nova-chat-title-wrap">

        <h3
          class="nova-chat-name"
          data-chat-name
        ></h3>

        <!-- Verification -->
        <span
          class="nova-chat-verified"
          data-chat-verified
          hidden
          title="حساب موثّق"
          aria-label="حساب موثّق"
        >
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M12 3.5l2 1.2 2.3-.1.9 2.1 1.9 1.3-.6 2.2.6 2.2-1.9 1.3-.9 2.1-2.3-.1-2 1.2-2-1.2-2.3.1-.9-2.1-1.9-1.3.6-2.2-.6-2.2 1.9-1.3.9-2.1 2.3.1 2-1.2Z"
              fill="currentColor"
            />
            <path
              d="m8.8 12.1 2.1 2.1 4.5-4.6"
              stroke="white"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <!-- Pinned -->
        <span
          class="nova-chat-pin"
          data-chat-pinned
          hidden
          title="محادثة مثبتة"
          aria-label="محادثة مثبتة"
        >
          <svg
            viewBox="0 0 24 24"
            width="13"
            height="13"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M8 4h8l-.8 5.2 2.8 3v1.3H6v-1.3l2.8-3L8 4Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path
              d="M12 13.5V21"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>

      </div>

      <!-- Time -->
      <time
        class="nova-chat-time"
        data-chat-time
        datetime=""
      ></time>

    </div>

    <!-- Bottom row -->
    <div class="nova-chat-bottom">

      <div class="nova-chat-preview-wrap">

        <!-- Message state -->
        <span
          class="nova-chat-message-state"
          data-chat-message-state
          hidden
          aria-hidden="true"
        >
          <svg
            class="nova-chat-state-single"
            data-state-single
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
          >
            <path
              d="m6.5 12.5 3.2 3.2L17.8 7.8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <svg
            class="nova-chat-state-double"
            data-state-double
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            hidden
          >
            <path
              d="m4.5 12.5 3.2 3.2L15.8 7.8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m9.5 12.5 3.2 3.2L20.8 7.8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <!-- Preview -->
        <p
          class="nova-chat-preview"
          data-chat-preview
        ></p>

      </div>

      <!-- Right-side indicators -->
      <div class="nova-chat-indicators">

        <!-- Muted -->
        <span
          class="nova-chat-muted"
          data-chat-muted
          hidden
          title="الإشعارات مكتومة"
          aria-label="الإشعارات مكتومة"
        >
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M6 10a6 6 0 0 1 12 0v3l1.5 2H4.5L6 13v-3Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path
              d="M10 19h4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="m4 4 16 16"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <!-- Unread count -->
        <span
          class="nova-chat-unread"
          data-chat-unread
          hidden
          aria-label="رسائل غير مقروءة"
        ></span>

      </div>

    </div>

  </div>

  <!-- Context action -->
  <button
    class="nova-chat-more"
    type="button"
    data-chat-menu
    aria-label="خيارات المحادثة"
    title="خيارات المحادثة"
  >
    <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      aria-hidden="true"
    >
      <circle
        cx="5"
        cy="12"
        r="1.5"
        fill="currentColor"
      />
      <circle
        cx="12"
        cy="12"
        r="1.5"
        fill="currentColor"
      />
      <circle
        cx="19"
        cy="12"
        r="1.5"
        fill="currentColor"
      />
    </svg>
  </button>

</article>


<style>
/* =========================================================
   NOVA — Chat Item Component Styles
   ========================================================= */

.nova-chat-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;

  width: 100%;
  min-height: 76px;

  padding: 11px 12px;

  border: 1px solid transparent;
  border-radius: 16px;

  background: transparent;

  color: var(--text-primary, #f4faf7);

  cursor: pointer;

  transition:
    background-color 180ms ease,
    border-color 180ms ease,
    transform 180ms ease,
    box-shadow 180ms ease;
}

.nova-chat-item:hover {
  background:
    linear-gradient(
      135deg,
      rgba(32, 212, 123, 0.075),
      rgba(255, 255, 255, 0.025)
    );

  border-color:
    rgba(32, 212, 123, 0.09);
}

.nova-chat-item:focus-visible {
  outline: 2px solid
    rgba(32, 212, 123, 0.8);

  outline-offset: 2px;
}

.nova-chat-item.is-active {
  background:
    linear-gradient(
      135deg,
      rgba(32, 212, 123, 0.13),
      rgba(32, 212, 123, 0.045)
    );

  border-color:
    rgba(32, 212, 123, 0.16);

  box-shadow:
    inset 3px 0 0
      var(--primary, #20d47b);
}

.nova-chat-item.is-unread {
  background:
    linear-gradient(
      135deg,
      rgba(32, 212, 123, 0.055),
      transparent
    );
}


/* =========================================================
   Avatar
   ========================================================= */

.nova-chat-avatar-wrap {
  position: relative;

  flex: 0 0 52px;

  width: 52px;
  height: 52px;
}

.nova-chat-avatar {
  width: 52px;
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #173b2e,
      #0d211a
    );

  border: 1px solid
    rgba(255, 255, 255, 0.08);

  color:
    rgba(255, 255, 255, 0.42);

  box-shadow:
    0 6px 20px
      rgba(0, 0, 0, 0.22);
}

.nova-chat-avatar img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.nova-chat-avatar-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Online indicator */

.nova-chat-online-dot {
  position: absolute;

  left: -1px;
  bottom: 1px;

  width: 13px;
  height: 13px;

  border-radius: 50%;

  background:
    var(--success, #20d47b);

  border: 3px solid
    var(--surface, #0c1d17);

  box-shadow:
    0 0 0 2px
      rgba(32, 212, 123, 0.12);
}


/* =========================================================
   Content
   ========================================================= */

.nova-chat-content {
  min-width: 0;
  flex: 1;
}

.nova-chat-top,
.nova-chat-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;

  min-width: 0;
}

.nova-chat-top {
  gap: 10px;
  margin-bottom: 5px;
}

.nova-chat-bottom {
  gap: 10px;
}


/* =========================================================
   Name
   ========================================================= */

.nova-chat-title-wrap {
  min-width: 0;

  display: flex;
  align-items: center;
  gap: 5px;
}

.nova-chat-name {
  min-width: 0;

  margin: 0;

  overflow: hidden;

  color:
    var(--text-primary, #f4faf7);

  font-family:
    "Cairo",
    "IBM Plex Sans Arabic",
    sans-serif;

  font-size: 14px;
  font-weight: 700;

  line-height: 1.4;

  white-space: nowrap;
  text-overflow: ellipsis;
}

.nova-chat-item.is-unread
.nova-chat-name {
  font-weight: 800;
}

.nova-chat-verified {
  flex: 0 0 auto;

  display: inline-flex;

  color:
    var(--primary, #20d47b);
}

.nova-chat-pin {
  flex: 0 0 auto;

  display: inline-flex;

  color:
    var(--text-muted, #9cafa8);
}


/* =========================================================
   Time
   ========================================================= */

.nova-chat-time {
  flex: 0 0 auto;

  color:
    var(--text-muted, #9cafa8);

  font-family:
    "IBM Plex Sans Arabic",
    "Cairo",
    sans-serif;

  font-size: 11px;
  font-weight: 500;

  white-space: nowrap;
}

.nova-chat-item.is-unread
.nova-chat-time {
  color:
    var(--primary, #20d47b);

  font-weight: 700;
}


/* =========================================================
   Preview
   ========================================================= */

.nova-chat-preview-wrap {
  min-width: 0;

  flex: 1;

  display: flex;
  align-items: center;

  overflow: hidden;
}

.nova-chat-preview {
  min-width: 0;

  margin: 0;

  overflow: hidden;

  color:
    var(--text-secondary, #c7d4ce);

  font-family:
    "IBM Plex Sans Arabic",
    "Cairo",
    sans-serif;

  font-size: 12px;
  font-weight: 400;

  line-height: 1.55;

  white-space: nowrap;
  text-overflow: ellipsis;
}

.nova-chat-item.is-unread
.nova-chat-preview {
  color:
    var(--text-primary, #f4faf7);

  font-weight: 600;
}


/* =========================================================
   Message state
   ========================================================= */

.nova-chat-message-state {
  flex: 0 0 auto;

  display: inline-flex;
  align-items: center;

  margin-inline-end: 4px;

  color:
    var(--text-muted, #9cafa8);
}

.nova-chat-message-state.is-read {
  color:
    var(--primary, #20d47b);
}


/* =========================================================
   Indicators
   ========================================================= */

.nova-chat-indicators {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  gap: 7px;
}

.nova-chat-muted {
  display: inline-flex;

  color:
    var(--text-muted, #9cafa8);
}

.nova-chat-unread {
  min-width: 20px;
  height: 20px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 0 6px;

  border-radius: 999px;

  background:
    var(--primary, #20d47b);

  color:
    #04110b;

  font-family:
    "IBM Plex Sans Arabic",
    "Cairo",
    sans-serif;

  font-size: 10px;
  font-weight: 800;

  line-height: 1;

  box-shadow:
    0 4px 14px
      rgba(32, 212, 123, 0.18);
}


/* =========================================================
   More menu button
   ========================================================= */

.nova-chat-more {
  position: absolute;

  top: 50%;
  left: 8px;

  width: 30px;
  height: 30px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  transform:
    translateY(-50%)
    scale(0.92);

  opacity: 0;

  border: 0;
  border-radius: 9px;

  background:
    rgba(8, 25, 20, 0.94);

  color:
    var(--text-muted, #9cafa8);

  cursor: pointer;

  transition:
    opacity 160ms ease,
    transform 160ms ease,
    color 160ms ease,
    background-color 160ms ease;

  z-index: 2;
}

.nova-chat-item:hover
.nova-chat-more,
.nova-chat-item:focus-within
.nova-chat-more {
  opacity: 1;

  transform:
    translateY(-50%)
    scale(1);
}

.nova-chat-more:hover {
  background:
    rgba(32, 212, 123, 0.1);

  color:
    var(--primary, #20d47b);
}

.nova-chat-more:focus-visible {
  outline:
    2px solid
    rgba(32, 212, 123, 0.6);

  outline-offset: 1px;
}


/* =========================================================
   Empty / missing content safety
   ========================================================= */

.nova-chat-name:empty::before {
  content: "محادثة";
  color:
    var(--text-muted, #9cafa8);
}

.nova-chat-preview:empty::before {
  content: "لا توجد رسائل";
  color:
    var(--text-muted, #9cafa8);
}


/* =========================================================
   Group variant
   ========================================================= */

.nova-chat-item[data-chat-type="group"]
.nova-chat-avatar {
  border-radius: 15px;
}

.nova-chat-item[data-chat-type="community"]
.nova-chat-avatar {
  border-radius: 15px;
}


/* =========================================================
   Mobile
   ========================================================= */

@media (max-width: 576px) {

  .nova-chat-item {
    min-height: 70px;

    padding:
      9px 8px;

    border-radius: 13px;

    gap: 11px;
  }

  .nova-chat-avatar-wrap,
  .nova-chat-avatar {
    width: 47px;
    height: 47px;

    flex-basis: 47px;
  }

  .nova-chat-name {
    font-size: 13px;
  }

  .nova-chat-preview {
    font-size: 11px;
  }

  .nova-chat-time {
    font-size: 10px;
  }

  .nova-chat-more {
    display: none;
  }

  .nova-chat-online-dot {
    width: 12px;
    height: 12px;
  }
}


/* =========================================================
   Reduced motion
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .nova-chat-item,
  .nova-chat-more {
    transition: none;
  }
}
  </style>
