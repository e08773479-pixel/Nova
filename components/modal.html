<!-- =========================================================
     NOVA — Modal Component
     File: components/modal.html
     Version: 1.0.0
     Purpose:
     Reusable modal / dialog system
     No fake/demo data
     ========================================================= -->

<div
  class="nova-modal"
  data-modal
  data-modal-id=""
  role="dialog"
  aria-modal="true"
  aria-labelledby="nova-modal-title"
  aria-describedby="nova-modal-description"
  hidden
>
  <!-- Backdrop -->
  <div
    class="nova-modal-backdrop"
    data-modal-backdrop
  ></div>

  <!-- Dialog -->
  <section
    class="nova-modal-dialog"
    data-modal-dialog
    tabindex="-1"
  >

    <!-- Header -->
    <header class="nova-modal-header">

      <div class="nova-modal-heading">

        <div
          class="nova-modal-icon"
          data-modal-icon
          hidden
        ></div>

        <div class="nova-modal-heading-text">

          <h2
            id="nova-modal-title"
            class="nova-modal-title"
            data-modal-title
          ></h2>

          <p
            id="nova-modal-description"
            class="nova-modal-description"
            data-modal-description
            hidden
          ></p>

        </div>

      </div>

      <button
        type="button"
        class="nova-modal-close"
        data-modal-close
        aria-label="إغلاق"
        title="إغلاق"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m7 7 10 10M17 7 7 17"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>

    <!-- Body -->
    <div
      class="nova-modal-body"
      data-modal-body
    ></div>

    <!-- Footer -->
    <footer
      class="nova-modal-footer"
      data-modal-footer
      hidden
    >

      <button
        type="button"
        class="nova-modal-button nova-modal-button-secondary"
        data-modal-cancel
      >
        إلغاء
      </button>

      <button
        type="button"
        class="nova-modal-button nova-modal-button-primary"
        data-modal-confirm
      >
        تأكيد
      </button>

    </footer>

  </section>
</div>


<style>
/* =========================================================
   NOVA — Modal System
   ========================================================= */

.nova-modal {
  position: fixed;

  inset: 0;

  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    20px;

  font-family:
    "IBM Plex Sans Arabic",
    "Cairo",
    sans-serif;
}

.nova-modal[hidden] {
  display: none;
}


/* =========================================================
   Backdrop
   ========================================================= */

.nova-modal-backdrop {
  position: absolute;

  inset: 0;

  background:
    rgba(1, 8, 5, 0.74);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  opacity: 0;

  transition:
    opacity 180ms ease;
}

.nova-modal.is-open
.nova-modal-backdrop {
  opacity: 1;
}


/* =========================================================
   Dialog
   ========================================================= */

.nova-modal-dialog {
  position: relative;

  width: min(
    100%,
    520px
  );

  max-height:
    min(90vh, 760px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,0.09);

  border-radius:
    22px;

  background:
    linear-gradient(
      145deg,
      rgba(15,38,30,0.98),
      rgba(7,20,15,0.99)
    );

  color:
    var(--text-primary, #f4faf7);

  box-shadow:
    0 30px 90px
    rgba(0,0,0,0.52),
    0 0 0 1px
    rgba(32,212,123,0.025);

  transform:
    translateY(12px)
    scale(.97);

  opacity: 0;

  transition:
    transform 180ms ease,
    opacity 180ms ease;
}

.nova-modal.is-open
.nova-modal-dialog {
  transform:
    translateY(0)
    scale(1);

  opacity: 1;
}


/* =========================================================
   Header
   ========================================================= */

.nova-modal-header {
  flex: 0 0 auto;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 16px;

  padding:
    18px 20px 14px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.06);
}

.nova-modal-heading {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 12px;
}

.nova-modal-icon {
  width: 42px;
  height: 42px;

  flex: 0 0 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius:
    13px;

  background:
    rgba(32,212,123,0.1);

  color:
    var(--primary, #20d47b);
}

.nova-modal-heading-text {
  min-width: 0;
}

.nova-modal-title {
  margin: 0;

  color:
    var(--text-primary, #f4faf7);

  font-family:
    "Cairo",
    "IBM Plex Sans Arabic",
    sans-serif;

  font-size: 17px;
  font-weight: 800;

  line-height: 1.5;
}

.nova-modal-description {
  margin:
    3px 0 0;

  color:
    var(--text-muted, #9cafa8);

  font-size: 11px;

  line-height: 1.7;
}

.nova-modal-close {
  width: 36px;
  height: 36px;

  flex: 0 0 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  border:
    1px solid
    rgba(255,255,255,0.06);

  border-radius:
    10px;

  background:
    rgba(255,255,255,0.025);

  color:
    var(--text-muted, #9cafa8);

  cursor: pointer;

  transition:
    color 160ms ease,
    background-color 160ms ease,
    border-color 160ms ease;
}

.nova-modal-close:hover {
  color:
    var(--text-primary, #f4faf7);

  background:
    rgba(255,255,255,0.06);

  border-color:
    rgba(255,255,255,0.11);
}

.nova-modal-close:focus-visible {
  outline:
    2px solid
    rgba(32,212,123,0.7);

  outline-offset:
    2px;
}


/* =========================================================
   Body
   ========================================================= */

.nova-modal-body {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding:
    18px 20px;

  color:
    var(--text-secondary, #c7d4ce);

  scrollbar-width:
    thin;

  scrollbar-color:
    rgba(32,212,123,0.35)
    transparent;
}

.nova-modal-body::-webkit-scrollbar {
  width: 6px;
}

.nova-modal-body::-webkit-scrollbar-track {
  background: transparent;
}

.nova-modal-body::-webkit-scrollbar-thumb {
  border-radius: 999px;

  background:
    rgba(32,212,123,0.3);
}


/* =========================================================
   Footer
   ========================================================= */

.nova-modal-footer {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  gap: 9px;

  padding:
    14px 20px 18px;

  border-top:
    1px solid
    rgba(255,255,255,0.06);
}

.nova-modal-button {
  min-height: 40px;

  padding:
    0 18px;

  border-radius:
    11px;

  font-family:
    "Cairo",
    "IBM Plex Sans Arabic",
    sans-serif;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform 150ms ease,
    background-color 150ms ease,
    border-color 150ms ease,
    opacity 150ms ease;
}

.nova-modal-button:active {
  transform:
    scale(.97);
}

.nova-modal-button:focus-visible {
  outline:
    2px solid
    rgba(32,212,123,0.7);

  outline-offset:
    2px;
}

.nova-modal-button-primary {
  border:
    1px solid
    rgba(32,212,123,0.3);

  background:
    var(--primary, #20d47b);

  color:
    #04110b;

  box-shadow:
    0 7px 20px
    rgba(32,212,123,0.13);
}

.nova-modal-button-primary:hover {
  background:
    #2be489;
}

.nova-modal-button-secondary {
  border:
    1px solid
    rgba(255,255,255,0.08);

  background:
    rgba(255,255,255,0.035);

  color:
    var(--text-secondary, #c7d4ce);
}

.nova-modal-button-secondary:hover {
  background:
    rgba(255,255,255,0.065);

  color:
    var(--text-primary, #f4faf7);
}


/* =========================================================
   Confirmation variant
   ========================================================= */

.nova-modal[data-modal-type="danger"]
.nova-modal-icon {
  background:
    rgba(255,92,103,0.1);

  color:
    var(--danger, #ff5c67);
}

.nova-modal[data-modal-type="danger"]
.nova-modal-button-primary {
  background:
    var(--danger, #ff5c67);

  border-color:
    rgba(255,92,103,0.35);

  color:
    #fff;
}

.nova-modal[data-modal-type="warning"]
.nova-modal-icon {
  background:
    rgba(242,201,76,0.1);

  color:
    var(--warning, #f2c94c);
}


/* =========================================================
   Form helpers inside modal
   ========================================================= */

.nova-modal-body
.nova-field {
  display: flex;
  flex-direction: column;

  gap: 7px;

  margin-bottom: 14px;
}

.nova-modal-body
.nova-field:last-child {
  margin-bottom: 0;
}

.nova-modal-body
.nova-field label {
  color:
    var(--text-secondary, #c7d4ce);

  font-size: 11px;
  font-weight: 700;
}

.nova-modal-body
.nova-field input,
.nova-modal-body
.nova-field textarea,
.nova-modal-body
.nova-field select {
  width: 100%;

  min-height: 42px;

  padding:
    9px 12px;

  border:
    1px solid
    rgba(255,255,255,0.08);

  border-radius:
    11px;

  outline: none;

  background:
    rgba(255,255,255,0.035);

  color:
    var(--text-primary, #f4faf7);

  font-family:
    inherit;

  font-size: 12px;

  transition:
    border-color 160ms ease,
    background-color 160ms ease,
    box-shadow 160ms ease;
}

.nova-modal-body
.nova-field textarea {
  min-height: 100px;

  resize: vertical;
}

.nova-modal-body
.nova-field input:focus,
.nova-modal-body
.nova-field textarea:focus,
.nova-modal-body
.nova-field select:focus {
  border-color:
    rgba(32,212,123,0.45);

  background:
    rgba(32,212,123,0.035);

  box-shadow:
    0 0 0 3px
    rgba(32,212,123,0.07);
}


/* =========================================================
   Loading state
   ========================================================= */

.nova-modal.is-loading
.nova-modal-dialog {
  pointer-events: none;
}

.nova-modal-loading {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 9px;

  min-height: 100px;

  color:
    var(--text-muted, #9cafa8);

  font-size: 12px;
}

.nova-modal-spinner {
  width: 18px;
  height: 18px;

  border:
    2px solid
    rgba(255,255,255,0.12);

  border-top-color:
    var(--primary, #20d47b);

  border-radius: 50%;

  animation:
    nova-modal-spin
    .7s linear infinite;
}

@keyframes nova-modal-spin {
  to {
    transform:
      rotate(360deg);
  }
}


/* =========================================================
   Mobile
   ========================================================= */

@media (max-width: 576px) {

  .nova-modal {
    align-items: flex-end;

    padding:
      0;
  }

  .nova-modal-dialog {
    width: 100%;

    max-height:
      92vh;

    border-radius:
      22px 22px 0 0;

    transform:
      translateY(25px);
  }

  .nova-modal.is-open
  .nova-modal-dialog {
    transform:
      translateY(0);
  }

  .nova-modal-header {
    padding:
      15px 15px 12px;
  }

  .nova-modal-body {
    padding:
      15px;
  }

  .nova-modal-footer {
    padding:
      12px 15px 16px;
  }

  .nova-modal-title {
    font-size: 15px;
  }

  .nova-modal-description {
    font-size: 10px;
  }

  .nova-modal-button {
    flex: 1;

    min-height: 42px;
  }
}


/* =========================================================
   Reduced motion
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .nova-modal-backdrop,
  .nova-modal-dialog,
  .nova-modal-button,
  .nova-modal-close {
    transition: none;
  }

  .nova-modal-spinner {
    animation-duration:
      1.5s;
  }
}
  </style>
