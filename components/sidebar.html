<style>
  /* =========================================================
     NOVA Sidebar
     ========================================================= */

  .nova-sidebar {
    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;

    z-index: 1100;

    width: 270px;

    display: flex;
    flex-direction: column;

    background:
      linear-gradient(
        180deg,
        rgba(7, 23, 17, .98),
        rgba(5, 16, 12, .98)
      );

    border-left:
      1px solid rgba(255,255,255,.07);

    box-shadow:
      -18px 0 60px
      rgba(0,0,0,.18);

    overflow: hidden;

    transition:
      transform .25s ease,
      box-shadow .25s ease;
  }


  .nova-sidebar__header {
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 15px;

    border-bottom:
      1px solid rgba(255,255,255,.06);
  }


  .nova-sidebar__brand {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #F4FAF7;

    text-decoration: none;
  }


  .nova-sidebar__logo {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
      linear-gradient(
        145deg,
        #20D47B,
        #12A85E
      );

    color: #06110D;

    font-size: 20px;
    font-weight: 900;

    box-shadow:
      0 8px 25px
      rgba(32,212,123,.18);
  }


  .nova-sidebar__brand-text {
    display: flex;
    flex-direction: column;

    line-height: 1.15;
  }


  .nova-sidebar__brand-text strong {
    font-size: 16px;
    letter-spacing: .4px;
  }


  .nova-sidebar__brand-text small {
    margin-top: 3px;

    color: #80958C;

    font-size: 9px;
  }


  .nova-sidebar__close {
    display: none;

    width: 36px;
    height: 36px;

    place-items: center;

    border: 0;
    border-radius: 10px;

    background:
      rgba(255,255,255,.05);

    color: #C7D4CE;

    cursor: pointer;
  }


  /* =========================================================
     Account
     ========================================================= */

  .nova-sidebar__account {
    display: flex;
    align-items: center;

    margin: 13px 12px 8px;

    padding: 9px;

    border:
      1px solid rgba(255,255,255,.055);

    border-radius: 15px;

    background:
      rgba(255,255,255,.035);
  }


  .nova-sidebar__account-link {
    min-width: 0;

    flex: 1;

    display: flex;
    align-items: center;
    gap: 10px;

    color: inherit;

    text-decoration: none;
  }


  .nova-sidebar__avatar {
    position: relative;

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: grid;
    place-items: center;

    overflow: visible;

    border-radius: 50%;

    background:
      linear-gradient(
        145deg,
        #163B2D,
        #0B2018
      );
  }


  .nova-sidebar__avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;
  }


  .nova-sidebar__avatar-placeholder {
    width: 100%;
    height: 100%;

    display: grid;
    place-items: center;

    border-radius: 50%;

    color: #20D47B;

    font-weight: 800;
  }


  .nova-sidebar__online {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #20D47B;

    border:
      2px solid #071710;
  }


  .nova-sidebar__account-info {
    min-width: 0;

    display: flex;
    flex-direction: column;
  }


  .nova-sidebar__account-info strong {
    overflow: hidden;

    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 12px;
  }


  .nova-sidebar__account-info small {
    margin-top: 3px;

    direction: ltr;
    text-align: right;

    overflow: hidden;

    text-overflow: ellipsis;
    white-space: nowrap;

    color: #82968D;

    font-size: 9px;
  }


  .nova-sidebar__profile-link {
    width: 30px;
    height: 30px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    color: #71857D;

    text-decoration: none;

    transition:
      color .2s ease,
      background .2s ease;
  }


  .nova-sidebar__profile-link:hover {
    color: #20D47B;

    background:
      rgba(32,212,123,.08);
  }


  /* =========================================================
     Navigation
     ========================================================= */

  .nova-sidebar__nav {
    flex: 1;

    overflow-y: auto;

    padding: 7px 10px 12px;

    scrollbar-width: thin;
    scrollbar-color:
      rgba(255,255,255,.12)
      transparent;
  }


  .nova-sidebar__section-title {
    display: block;

    padding:
      7px 10px 6px;

    color: #637A70;

    font-size: 9px;
    font-weight: 700;
  }


  .nova-sidebar__item {
    position: relative;

    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 45px;

    margin: 2px 0;

    padding: 0 11px;

    border-radius: 12px;

    color: #B7C7C0;

    text-decoration: none;

    transition:
      background .18s ease,
      color .18s ease,
      transform .18s ease;
  }


  .nova-sidebar__item:hover {
    color: #F4FAF7;

    background:
      rgba(255,255,255,.045);

    transform:
      translateX(-2px);
  }


  .nova-sidebar__item.active,
  .nova-sidebar__item[aria-current="page"] {
    color: #20D47B;

    background:
      linear-gradient(
        90deg,
        rgba(32,212,123,.13),
        rgba(32,212,123,.045)
      );
  }


  .nova-sidebar__item.active::before,
  .nova-sidebar__item[aria-current="page"]::before {
    content: "";

    position: absolute;

    right: 0;
    top: 9px;
    bottom: 9px;

    width: 3px;

    border-radius: 5px;

    background: #20D47B;
  }


  .nova-sidebar__icon {
    width: 23px;
    height: 23px;

    flex: 0 0 23px;

    display: grid;
    place-items: center;

    font-size: 17px;

    color: inherit;
  }


  .nova-sidebar__label {
    flex: 1;

    font-size: 12px;
    font-weight: 600;
  }


  .nova-sidebar__badge {
    min-width: 20px;
    height: 20px;

    padding: 0 5px;

    display: grid;
    place-items: center;

    border-radius: 999px;

    background: #20D47B;
    color: #06110D;

    font-size: 9px;
    font-weight: 900;
  }


  .nova-sidebar__divider {
    height: 1px;

    margin:
      9px 8px;

    background:
      rgba(255,255,255,.055);
  }


  /* =========================================================
     Footer
     ========================================================= */

  .nova-sidebar__footer {
    padding: 11px 12px 14px;

    border-top:
      1px solid rgba(255,255,255,.06);
  }


  .nova-sidebar__status {
    display: flex;
    align-items: center;
    gap: 7px;

    padding:
      7px 8px 10px;

    color: #70847B;

    font-size: 9px;
  }


  .nova-sidebar__status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #20D47B;

    box-shadow:
      0 0 9px
      rgba(32,212,123,.5);
  }


  .nova-sidebar__logout {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 10px;

    min-height: 40px;

    padding: 0 11px;

    border: 0;
    border-radius: 11px;

    background:
      rgba(255,255,255,.035);

    color: #9AAEA5;

    font: inherit;
    font-size: 11px;

    cursor: pointer;

    text-align: right;

    transition:
      background .2s ease,
      color .2s ease;
  }


  .nova-sidebar__logout:hover {
    background:
      rgba(255,92,103,.08);

    color: #FF7A83;
  }


  /* =========================================================
     Overlay
     ========================================================= */

  .nova-sidebar-overlay {
    position: fixed;

    inset: 0;

    z-index: 1050;

    background:
      rgba(0,0,0,.55);

    backdrop-filter:
      blur(3px);

    -webkit-backdrop-filter:
      blur(3px);
  }


  /* =========================================================
     Mobile
     ========================================================= */

  @media (max-width: 900px) {

    .nova-sidebar {
      transform:
        translateX(105%);

      box-shadow: none;
    }


    .nova-sidebar.is-open {
      transform:
        translateX(0);

      box-shadow:
        -20px 0 70px
        rgba(0,0,0,.4);
    }


    .nova-sidebar__close {
      display: grid;
    }


    .nova-sidebar-overlay.is-visible {
      display: block;
    }

  }


  @media (min-width: 901px) {

    .nova-sidebar-overlay {
      display: none !important;
    }

  }


  @media (max-width: 420px) {

    .nova-sidebar {
      width: min(310px, 88vw);
    }

    .nova-sidebar__brand-text {
      display: none;
    }

  }
  </style>
